[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "credit-simulator"
version = "0.1.0"
description = "Interactive credit / mortgage loan simulator"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.4",
]

[project.scripts]
credit-simulator = "credit_simulator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/credit_simulator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q --cov=src/credit_simulator --cov-report=term-missing --cov-report=html:htmlcov"

[tool.coverage.run]
branch = true
source = ["src/credit_simulator"]
omit = [
    "src/credit_simulator/__main__.py",
    "src/credit_simulator/cli.py",    # interactive CLI — covered by integration tests separately
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
