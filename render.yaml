# Retired: the API now runs as a Vercel Service (docs/deployment.md). Kept until the
# Vercel cut-over is verified, then deleted together with the Render service.
services:
  - type: web
    name: credit-simulator-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -e ".[web]"
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: TRUSTED_PROXY_HOPS
        sync: false
