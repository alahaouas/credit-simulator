name: Supabase Keep-Alive

on:
  schedule:
    # Every day at 06:16 UTC
    - cron: "16 6 * * *"
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secret"
            exit 1
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/" || echo "000")

          echo "Supabase REST API responded with HTTP $status"

          if [ "$status" -lt 200 ] || [ "$status" -ge 500 ] || [ "$status" = "000" ]; then
            echo "::error::Supabase project looks unreachable (HTTP $status) - it may be paused. Check https://supabase.com/dashboard/project/dqfdjtrcxobhwdnxmorh"
            exit 1
          fi
