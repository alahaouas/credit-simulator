name: Deploy to Supabase

# Applies supabase/migrations and deploys supabase/functions to production
# once — and only once — the CI workflow has passed on main. Migrations are
# additive/idempotent (supabase db push only applies migrations not yet
# recorded on the remote database), so re-running this workflow is safe.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # Allow re-running a deploy manually (e.g. after fixing a transient failure)
  # without needing to re-push a commit.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-supabase-${{ github.ref }}
  # Never cancel a deploy already talking to the production database.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dqfdjtrcxobhwdnxmorh
    steps:
      - uses: actions/checkout@v7
        with:
          # Deploy exactly the commit that passed CI, not whatever main has
          # moved to by the time this job starts.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Link project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Push database migrations
        run: supabase db push

      - name: Deploy edge functions
        run: supabase functions deploy --project-ref $SUPABASE_PROJECT_ID
