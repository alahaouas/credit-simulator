name: IndexNow

# Announces the sitemap's URLs to Bing and Yandex (Google does not take part).
#
# Deliberately narrow: only a change to the sitemap's source triggers this. Every
# submitted URL counts against the site's crawl quota, so re-announcing the same
# handful of URLs on each deploy would spend quota to tell Bing nothing new. A
# positive `paths` filter is tighter than the `paths-ignore` lists on the other
# workflows — leave it that way rather than widening it to match them.
#
# The sitemap is generated by web/app/sitemap.ts from PUBLIC_PATHS in
# web/lib/site.ts, so both files are sitemap sources.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/app/sitemap.ts'
      - 'web/lib/site.ts'
      - 'web/public/*.txt'

permissions:
  contents: read

# Two deploys in quick succession must not submit concurrently.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    name: Submit sitemap URLs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # --wait polls the live sitemap and key file until every listed URL answers
      # 200, so a push racing its own Vercel deploy cannot announce a URL that is
      # not served yet. SITE_URL is a repository *variable*, not a secret: the
      # site's own domain is public. See docs/indexnow.md.
      - name: Submit sitemap URLs to IndexNow
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: node scripts/indexnow.mjs --wait
